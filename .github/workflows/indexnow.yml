name: Submit published URLs to IndexNow
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Published canonical URLs or paths, separated by spaces (after deployment succeeds)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live pages and notify IndexNow
        env:
          INDEXNOW_URLS: ${{ inputs.urls }}
        run: |
          node --input-type=module -e "import {spawnSync} from 'node:child_process'; const r=spawnSync(process.execPath,['scripts/indexnow.mjs',...process.env.INDEXNOW_URLS.trim().split(/\s+/)],{stdio:'inherit'}); process.exit(r.status ?? 1);"
