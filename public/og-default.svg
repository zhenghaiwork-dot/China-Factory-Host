  <g transform="translate(880,180) scale(7)" fill="none" stroke="#0E6A7B" stroke-opacity="0.35" stroke-width="1.4" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M4,26 V19 L11,13 V19 L18,13 V19 L25,13 V26 H22 V20 H13 V26 H4 Z"/>
  </g>

  <!-- Accent rule -->
  <rect x="96" y="176" width="72" height="4" fill="#0E6A7B"/>

  <text x="96" y="300" font-family="Archivo, 'Archivo Variable', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2.4" fill="#FFFFFF">Real factory floors,</text>
  <text x="96" y="384" font-family="Archivo, 'Archivo Variable', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2.4" fill="#FFFFFF">verified before you fly.</text>

  <text x="96" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#B3ADA2">Factory visits, filming coordination and supplier checks.</text>
  <text x="96" y="494" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#B3ADA2">Hosted from Zhejiang, reachable across China.</text>

