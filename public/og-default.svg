  <title id="cfh-og-title">ChinaFactoryHost — verified factory visits in China</title>
  <desc id="cfh-og-desc">On-the-ground factory visits, filming coordination and supplier verification. Based in Zhejiang, reachable nationwide.</desc>

  <rect width="1200" height="630" fill="#171613"/>
